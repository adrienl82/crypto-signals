# Comment l'ajouter (depuis ton téléphone) :
#
# 1. Vue Lovelace -> "+" pour ajouter une vue, ou modifie une vue existante
#    -> en haut à droite "..." -> "Modifier en YAML" -> colle ce qui suit
#
# Pas besoin de créer de helper : les deux automatisations (une fois ajoutées
# via deploy/ha_automation_example.yaml) apparaissent comme des entités
# automation.* avec un interrupteur marche/arrêt natif -- c'est ton bouton
# "activer/désactiver les notifications", déjà inclus ci-dessous.

title: Crypto
views:
  - title: Crypto
    icon: mdi:currency-btc
    cards:
      - type: entities
        title: Signaux & notifications
        entities:
          - entity: automation.crypto_alerte_signal_btc
            name: Notifs BTC actives
          - entity: automation.crypto_alerte_signal_eth
            name: Notifs ETH actives
          - entity: sensor.btc_signal
            name: Signal BTC
          - entity: sensor.eth_signal
            name: Signal ETH

      - type: glance
        title: Cours actuels
        entities:
          - entity: sensor.btc_price
            name: BTC
          - entity: sensor.eth_price
            name: ETH

      - type: history-graph
        title: Tendance BTC (prix)
        hours_to_show: 168   # 7 jours ; augmente si tu veux plus de recul
        entities:
          - entity: sensor.btc_price

      - type: history-graph
        title: Tendance BTC (RSI)
        hours_to_show: 168
        entities:
          - entity: sensor.btc_rsi

      - type: history-graph
        title: Tendance ETH (prix)
        hours_to_show: 168
        entities:
          - entity: sensor.eth_price

      - type: history-graph
        title: Tendance ETH (RSI)
        hours_to_show: 168
        entities:
          - entity: sensor.eth_rsi
