# A coller dans Home Assistant : Paramètres -> Automatisations -> "+ Créer une
# automatisation" -> "..." (en haut à droite) -> "Modifier en YAML" -> colle,
# sauvegarde. Chaque automatisation a un interrupteur marche/arrêt natif dans
# la liste des automatisations (pas besoin de helper séparé pour couper les
# notifs : il suffit de désactiver l'automatisation elle-même).

- alias: "Crypto - alerte signal BTC"
  trigger:
    - platform: state
      entity_id: sensor.btc_signal
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state in ['buy', 'sell'] }}"
    - condition: template
      value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
  action:
    - service: notify.mobile_app_ton_telephone   # remplace par ton service notify
      data:
        title: "BTC signal: {{ trigger.to_state.state }}"
        message: >
          Close: {{ trigger.to_state.attributes.close }} $
          RSI: {{ trigger.to_state.attributes.rsi }}

